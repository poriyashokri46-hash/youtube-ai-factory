name: Build YouTube AI Factory Android App

on:
  push:
    branches: [ "main", "master", "fix/remove-fake-features" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub web / mobile interface

# Keep only the newest validation run for each branch/PR to avoid wasting CI minutes.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate code; build artifacts on final-build request
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare build environment and keystore
        run: |
          # Ensure .env file exists for secrets plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          
          # Restore debug keystore if encoded file exists, or generate fresh one
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Print final debug signing certificate SHA-1 for OAuth setup
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[final-build]')
        run: keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA-1:'

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[final-build]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[final-build]'))
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Debug AAB (Android App Bundle)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[final-build]'))
        run: ./gradlew bundleDebug --no-daemon

      - name: Upload APK Artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[final-build]'))
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-AI-Factory-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload AAB Artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[final-build]'))
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-AI-Factory-AAB
          path: app/build/outputs/bundle/debug/*.aab
          retention-days: 30
